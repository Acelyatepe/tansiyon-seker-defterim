name: tansiyon_seker_defterim
description: "Tansiyon Şeker Defterim Android uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: 6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/config/admob.json
    - assets/images/splash_logo_safe.png

flutter_native_splash:
  color: "#F7F7F5"
  image: assets/images/splash_logo_safe.png

  android_12:
    color: "#F7F7F5"
    image: assets/images/splash_logo_safe.png